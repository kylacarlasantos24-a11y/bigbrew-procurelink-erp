<script>
const P=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
const ROLES={'Requester':['dash','pr'],'Purchasing Officer':['dash','pr','po','md','rep','aud'],'Warehouse Staff':['dash','gr','inv'],'Accounting Staff':['dash','acc','rep'],'Accounting Manager':['dash','acc','rep','aud'],'Administrator':['dash','pr','po','gr','inv','acc','md','rep','aud','cfg']};

const NAVG=[[null,['dash']],['Purchasing / Procurement',['pr','po']],['Inventory / Warehouse',['gr','inv']],['Accounting / Finance',['acc']],['Data & Oversight',['md','rep','aud','cfg']]];
const navHTML=()=>NAVG.map(([h,ks])=>{const a=ks.filter(k=>ROLES[role].includes(k));return a.length?(h?`<div class='sec'>${h}</div>`:'')+a.map(k=>`<a tabindex=0 class="${k==page?'on':''}" onclick="go('${k}')">${NAV[k]}</a>`).join(''):''}).join('');
const S={cfg:{auto:5000,mgr:25000,tw:true},audit:[],
items:[{c:'ITM-002',d:'Black tea leaves',u:'kg',std:420,s:10},{c:'ITM-009',d:'Brown sugar syrup',u:'bottle',std:185,s:12},{c:'ITM-014',d:'Non-dairy creamer',u:'kg',std:250,s:8},{c:'ITM-027',d:'16 oz cups',u:'pcs',std:7.5,s:800},{c:'ITM-031',d:'Milk powder',u:'kg',std:310,s:5},{c:'ITM-040',d:'Coffee beans',u:'kg',std:620,s:6}],
sups:[{id:'SUP-0001',n:'Sample Supplier A',cp:'Maria Reyes',cn:'0917 555 0101',t:'Net 30',st:'Active',pr:{'ITM-002':420,'ITM-009':185,'ITM-014':250,'ITM-027':7.5,'ITM-031':310}},{id:'SUP-0002',n:'FoodCorp',cp:'Carlo Mendoza',cn:'0918 555 0102',t:'Net 15',st:'Active',od:true,pr:{'ITM-002':430,'ITM-040':620}},{id:'SUP-0003',n:'OfficeMart',cp:'Ana Lim',cn:'0919 555 0103',t:'COD',st:'Inactive',pr:{}}],
prs:[{id:'PR-2026-001',date:today(),dep:'Operations',by:'M. Santos',lines:[{c:'ITM-002',q:50},{c:'ITM-014',q:25},{c:'ITM-009',q:40},{c:'ITM-027',q:2000}],total:49650,st:'Approved'},{id:'PR-2026-002',date:today(),dep:'Admin',by:'M. Santos',lines:[{c:'ITM-040',q:10}],total:6200,st:'Pending'}],
pos:[],grs:[],ivs:[],sprs:[]};
const seq={PR:3,PO:1,GR:1,IV:1,SPR:1};const LOGO=`<svg class='lg' width='76' height='56' viewBox='0 0 60 44'><rect width='60' height='44' rx='7' fill='#8a4a1d'/><path d='M9 15c6-7 14-5 21 1 7-6 15-8 21-1-4 9-12 7-21 3-9 4-17 6-21-3z' fill='#2a1408'/><text x='30' y='37' text-anchor='middle' font-size='9' font-weight='700' fill='#f6e2cc' font-family='Poppins,sans-serif'>BIGBREW</text></svg>`;S.sales=[];

const id=p=>p+'-2026-'+String(seq[p]++).padStart(3,'0');
const it=c=>S.items.find(i=>i.c==c);const sup=i=>S.sups.find(s=>s.id==i);
const con=i=>{const s=sup(i)||{};return (s.cp||'-')+' · '+(s.cn||'-')};
const supCellO=s=>s?`${esc(s.n)}<br><small style="color:var(--mut)">${esc(s.cp||'-')} · <span style="white-space:nowrap">${esc(s.cn||'-')}</span></small>`:'-';
const supCell=i=>supCellO(sup(i));
const reqS=p=>p.sn?{n:p.sn,cp:p.scp,cn:p.scn}:sup(p.sup);
const poS=reqS,conO=s=>(s&&s.cp||'-')+' · '+(s&&s.cn||'-');
const ivS=i=>{const p=S.pos.find(x=>x.id==i.po);return p?poS(p):sup(i.sup)};
const supKey=p=>p.sup||'x:'+(p.sn||'').toLowerCase();
function sdf(k,x){ui.sd=ui.sd||{};ui.sd[k]=x}
function pSup(x){const s=sup(x);ui.sup=x;ui.sd={n:s?s.n:'',cp:s?s.cp||'':'',cn:s?s.cn||'':''};R()}
function rFill(x){const s=sup(x),g=i=>document.getElementById(i);g('rsn').value=s?s.n:'';g('rscp').value=s?s.cp||'':'';g('rscn').value=s?s.cn||'':''}
function reqSupBlock(eid){const ep=S.prs.find(p=>p.id==eid),r=ep?reqS(ep):null,E=x=>esc(x==null?'':x);
 return `<div class="row" style="margin-top:10px"><label>Supplier *<select id="rsup" onchange="rFill(this.value)"><option value="">Select supplier</option>${opts(S.sups.filter(x=>x.st=='Active').map(x=>[x.id,x.n+(x.od?' (overdue invoices)':'')]).concat([['OTHER','Other supplier (type name)']]),ep?(ep.sup||(ep.sn?'OTHER':'')):'')}</select></label><label>Supplier name *<input id="rsn" value="${E(r&&r.n)}" placeholder="Supplier name"></label><label>Contact person<input id="rscp" value="${E(r&&r.cp)}" placeholder="Contact person"></label><label>Contact number<input id="rscn" type="tel" value="${E(r&&r.cn)}" placeholder="09XX XXX XXXX"></label></div>`}
const poOf=prid=>S.pos.find(p=>p.pr==prid);
const prSup=id=>{const po=poOf(id),p=S.prs.find(x=>x.id==id),r=p&&reqS(p);return po?supCellO(poS(po)):(r?supCellO(r)+'<br><small style="color:var(--acc);font-weight:600">Requested</small>':'<small style="color:var(--mut)">Not yet ordered</small>')};

const supM=i=>supMO(sup(i));
const prSupM=id=>{const po=poOf(id),p=S.prs.find(x=>x.id==id),r=po?poS(po):p&&reqS(p);return r?`<br><small>${po?'Supplier':'Requested supplier'}: </small>${supMO(r)}`:''};
const log=a=>S.audit.unshift({t:new Date().toLocaleString('en-PH'),r:role,a});
const say=(m,bad)=>{note={m,bad};R()};
const tag=s=>`<span class="tag ${/Approved|Verified|Paid|Received$|^Open|Active/.test(s)&&!/Partially/.test(s)?'t-g':/Pending|Partially|Hold|For Approval|Credit/.test(s)?'t-a':/Reject|Inactive/.test(s)?'t-r':''}">${s}</span>`;
const v=i=>+document.getElementById(i).value;
const can=(...r)=>r.includes(role)||role=='Administrator';
const go=k=>{page=k;note=null;ui.vi=ui.pv=ui.pf=null;R()};const sw=r=>{role=r;if(!ROLES[r].includes(page)&&page!='mob')page='dash';note=null;R()};

/* ---------- actions ---------- */
function login(){const u=document.getElementById('uid').value.trim()||'User',pw=document.getElementById('upw').value,a=users[u];
 if(a&&a.pw!=pw)return say('Wrong password for this account.',1);
 me=a?a.n:u;role='Administrator';page='dash';note=null;pre='';log('Logged in as '+me);R()}
function logout(){role=null;ui={};note=null;mode='in';pre='';R()}
function signup(){const n=document.getElementById('un').value.trim(),u=document.getElementById('uid').value.trim(),pw=document.getElementById('upw').value;
 if(!n||!u||!pw)return say('Enter your name, a user ID and a password.',1);
 if(users[u])return say('That user ID is already taken. Choose another one.',1);
 users[u]={n,pw};log('Created account '+u+' ('+n+')');pre=u;mode='in';say('Account created! Please log in with your new User ID and password.')}
function newPR(){const lines=[0,1,2].map(i=>({c:document.getElementById('i'+i).value,q:v('q'+i)})).filter(l=>l.c&&l.q>0);
 if(!lines.length)return say('Add at least one item with a quantity.',1);
 const g=x=>document.getElementById(x).value,sid=g('rsup'),S0=sup(sid),sn=g('rsn').trim();
 if(!sid)return say('Select a supplier.',1);if(!sn)return say('Enter the supplier name.',1);
 const total=lines.reduce((a,l)=>a+l.q*(S0&&S0.pr[l.c]!=null?S0.pr[l.c]:it(l.c).std),0),auto=total<=S.cfg.auto,p={id:id('PR'),date:today(),dep:g('dep'),by:role,sup:S0?sid:'',sn,scp:g('rscp'),scn:g('rscn'),lines,total,st:auto?'Approved':'Pending'};
 if(ui.epr){const e=S.prs.find(x=>x.id==ui.epr);Object.assign(e,{lines,total,dep:p.dep,st:p.st,sup:p.sup,sn,scp:p.scp,scn:p.scn});ui.epr='';log('Edited '+e.id);return say(e.id+' updated.')}S.prs.unshift(p);log(`Created ${p.id} (${P(total)})${auto?' - auto-approved':''}`);say(auto?`${p.id} submitted and auto-approved (within ${P(S.cfg.auto)}).`:`${p.id} submitted for approval.`)}
function appr(i,yes){const p=S.prs.find(x=>x.id==i);
 if(yes&&p.total>S.cfg.mgr&&role!='Administrator')return say(`Requests above ${P(S.cfg.mgr)} need finance approval (Administrator).`,1);
 p.st=yes?'Approved':'Rejected';log(`${yes?'Approved':'Rejected'} ${i}`);say(`${i} ${p.st.toLowerCase()}.`)}
const nextId=p=>p+'-2026-'+String(seq[p]).padStart(3,'0');
const N=n=>Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});

function issuePO(draft){const pr=S.prs.find(p=>p.id==ui.pr),sid=ui.sup,s=sup(sid),sd=ui.sd||{},sn=(sd.n||'').trim();
 if(!pr||!sid)return say('Select an approved PR and a supplier.',1);
 if(!sn)return say('Enter the supplier name.',1);
 if(s&&s.st!='Active')return say('Inactive suppliers cannot be used in a new PO.',1);
 if(s&&s.od)return say(`${s.n} has overdue invoices and is blocked from new POs.`,1);
 const lines=pr.lines.map(l=>({c:l.c,q:l.q,p:s?s.pr[l.c]:it(l.c).std,rec:0}));
 if(lines.some(l=>l.p==null))return say('Some items are missing from this supplier price list. Choose another supplier or add price lines in Master Data.',1);
 if(!draft&&!ui.eta)return say('Expected delivery date is required.',1);
 const po={id:id('PO'),pr:pr.id,sup:s?s.id:'',sn,scp:sd.cp||'',scn:sd.cn||'',t:s?s.t:(ui.ptm||'Net 30'),lines,total:lines.reduce((a,l)=>a+l.q*l.p,0),rem:ui.rem||'',loc:ui.loc||'Main Warehouse',etaI:ui.eta||'',eta:fmtD(ui.eta),date:today(),st:draft?'Draft':'Open'};
 S.pos.unshift(po);if(!draft)pr.st='Ordered';
 log(draft?`Saved draft ${po.id} for ${sn} (${P(po.total)})`:`Issued ${po.id} to ${sn} (${P(po.total)})`);ui={};
 say(draft?`${po.id} saved as draft. Issue it from the list below when ready.`:`${po.id} issued to ${sn}. Expected delivery is now visible to Warehouse and Accounting.`)}
function issueDraft(i){const po=S.pos.find(p=>p.id==i),s=sup(po.sup),pr=S.prs.find(p=>p.id==po.pr);
 if(s&&s.st!='Active')return say('Inactive suppliers cannot be used in a new PO.',1);

 if(pr&&pr.st!='Approved')return say(`${po.pr} is already ordered. Cancel this draft instead.`,1);
 if(!po.etaI)return say('Set an expected delivery date first (use Edit).',1);
 po.st='Open';if(pr)pr.st='Ordered';log(`Issued ${po.id} to ${poS(po).n} (${P(po.total)})`);say(`${po.id} issued to ${poS(po).n}. Expected delivery is now visible to Warehouse and Accounting.`)}
function grCalc(){const po=S.pos.find(p=>p.id==ui.gr);if(!po||!document.getElementById('grst'))return;let done=true;
